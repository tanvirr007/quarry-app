name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Release APK
    if: github.repository_owner == 'tanvirr007'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write sign info
        if: github.repository == 'tanvirr007/quarry-app'
        run: |
          mkdir -p keystore
          KEYSTORE_DATA="${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.SIGNING_KEY }}"
          if [ ! -z "$KEYSTORE_DATA" ]; then
            echo "$KEYSTORE_DATA" | base64 --decode > keystore/release.jks
            echo storePassword='${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}' > key.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> key.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> key.properties
            echo storeFile='keystore/release.jks' >> key.properties
          fi

      - name: Calculate next version name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force 2>/dev/null || true
          GRADLE_VER=$(${{ github.workspace }}/gradlew -q printVersionName | tail -n 1)
          cat << 'EOF' > calculate_version.py
          import re, subprocess, sys
          def parse_version(v_str):
              match = re.search(r'(\d+)\.(\d+)\.(\d+)', v_str)
              return tuple(map(int, match.groups())) if match else (0, 0, 0)
          
          gradle_ver = sys.argv[1]
          g_maj, g_min, g_pat = parse_version(gradle_ver)
          
          tags = []
          try:
              raw_tags = subprocess.check_output(['git', 'tag', '-l'], text=True).splitlines()
              tags.extend(raw_tags)
          except Exception:
              pass

          try:
              raw_releases = subprocess.check_output(['gh', 'release', 'list', '--limit', '100', '--json', 'tagName', '--jq', '.[].tagName'], text=True).splitlines()
              tags.extend(raw_releases)
          except Exception:
              pass

          highest_tag = (0, 0, 0)
          for t in tags:
              t_parsed = parse_version(t.strip())
              if t_parsed > highest_tag:
                  highest_tag = t_parsed

          t_maj, t_min, t_pat = highest_tag
          
          if (g_maj, g_min, g_pat) > (t_maj, t_min, t_pat):
              next_ver = f"{g_maj}.{g_min}.{g_pat}"
          else:
              next_ver = f"{t_maj}.{t_min}.{t_pat + 1}"
          print(next_ver)
          EOF
          VERSION_NAME=$(python3 calculate_version.py "$GRADLE_VER")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Calculated version: $VERSION_NAME"
          rm calculate_version.py

      - name: Set application version name
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: "${{ env.VERSION_NAME }}"

      - name: Build with Gradle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: "${{ env.VERSION_NAME }}"
          APP_NAME: "Quarry"
        run: python3 .github/scripts/bot.py monitor

      - name: Prepare APK files for release
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Quarry-v${{ env.VERSION_NAME }}.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Quarry.apk

      - name: Get build metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          APK_SHA=$(sha256sum app/build/outputs/apk/release/Quarry.apk | awk '{print $1}')
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

          # Resolve the previous published release via the GitHub API. Git tags
          # can point at stale commits (edited/re-run releases), so the commit
          # listed in the previous release body is the range base of truth.
          PREV_RELEASE=""
          PREV_COMMIT=""
          for attempt in 1 2 3; do
            PREV_RELEASE=$(gh release list --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq '.[].tagName' | grep -v "^v${{ env.VERSION_NAME }}$" | head -n 1)
            if [ -n "$PREV_RELEASE" ]; then
              PREV_COMMIT=$(gh release view "$PREV_RELEASE" --json body --jq '.body' | awk -F'[`]' '/\* \*\*Commit:\*\*/{print $2; exit}')
            fi
            if [ -n "$PREV_COMMIT" ]; then
              break
            fi
            echo "Warning: previous release commit not resolved yet (attempt $attempt/3), retrying..."
            sleep 2
          done

          # Fall back to the root commit when there is no previous release
          if [ -z "$PREV_COMMIT" ]; then
            PREV_COMMIT=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous release: $PREV_RELEASE (commit $PREV_COMMIT)"

          # Previous release body, used to skip commits already shipped
          PREV_BODY=$(gh release view "$PREV_RELEASE" --json body --jq '.body' 2>/dev/null || echo "")

          # Build changelog
          CHANGELOG=""
          commits=$(git log --pretty=format:"%H %s" $PREV_COMMIT..HEAD)

          if [ -z "$commits" ]; then
            CHANGELOG="* No changes."
          else
            while read -r hash title || [ -n "$hash" ]; do
              if [ ! -z "$hash" ]; then
                if [[ "$title" =~ ^release:\ OTA\ manifest ]] || [[ "$title" =~ ^update:\ raw\ CDN ]] || [[ "$title" =~ ^Update\ version\.json ]]; then
                  continue
                fi
                if [ -n "$PREV_BODY" ] && grep -qF "(${hash:0:7})" <<< "$PREV_BODY"; then
                  continue
                fi
                CHANGELOG="${CHANGELOG}* **$title** (${hash:0:7})"$'\n'
                body=$(git log -1 --pretty=format:"%b" "$hash" | grep -v -E "^Signed-off-by:|^Change-Id:|^Co-authored-by:" | sed '/^-\{3,\}$/,$d' | sed '/^TEST:$/,$d' | sed -e :a -e '/^[[:space:]]*$/{ $d; N; ba; }' || true)
                if [ ! -z "$body" ]; then
                  while IFS= read -r line; do
                    if [ ! -z "$line" ]; then
                      clean_line=$(echo "$line" | sed -E 's/^[[:space:]]*[-*•]+[[:space:]]*/- /')
                      CHANGELOG="${CHANGELOG}  $clean_line"$'\n'
                    fi
                  done <<< "$body"
                fi
              fi
            done <<< "$commits"
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* No changes."
          fi
          
          # Generate release_notes.md
          cat <<EOF | sed 's/^          //' > release_notes.md
          ![Quarry Banner](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/assets/update.png?raw=true)
          
          **Quarry**
          
          > [!NOTE]
          > This release tracks build \`v${{ env.VERSION_NAME }}\` (Build ${{ github.run_number }})
          
          ### 📦 Build Information
          * **Version:** \`v${{ env.VERSION_NAME }}\`
          * **Commit:** [\`$COMMIT_HASH\`](https://github.com/${{ github.repository }}/commit/$COMMIT_HASH)
          * **Build Time:** \`${BUILD_TIME}\`
          * **Android:** \`12.0+\`
          * **SHA-256:** \`$APK_SHA\`
          
          ### 🔗 Direct Downloads
          * **Versioned APK:** [Quarry-v${{ env.VERSION_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/Quarry-v${{ env.VERSION_NAME }}.apk)
          * **Latest APK (Permanent Link):** [Quarry.apk](https://github.com/${{ github.repository }}/releases/latest/download/Quarry.apk)
          
          ### 📝 Changelog
          ${CHANGELOG}
          EOF
          echo "APK_SHA=$APK_SHA" >> $GITHUB_ENV
          echo "CHANGELOG<<EOF_CHANGELOG" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF_CHANGELOG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Quarry-v${{ env.VERSION_NAME }}"
          path: app/build/outputs/apk/release/Quarry-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION_NAME }}" \
            --title "v${{ env.VERSION_NAME }}" \
            -F release_notes.md \
            app/build/outputs/apk/release/Quarry-v${{ env.VERSION_NAME }}.apk \
            app/build/outputs/apk/release/Quarry.apk || \
          (gh release edit "v${{ env.VERSION_NAME }}" -F release_notes.md && \
           gh release upload "v${{ env.VERSION_NAME }}" \
            app/build/outputs/apk/release/Quarry-v${{ env.VERSION_NAME }}.apk \
            app/build/outputs/apk/release/Quarry.apk --clobber)

      - name: Send Telegram Notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: "${{ env.VERSION_NAME }}"
          COMMIT_HASH: "${{ env.COMMIT_HASH }}"
          BUILD_TIME: "${{ env.BUILD_TIME }}"
          APK_SHA: "${{ env.APK_SHA }}"
          CHANGELOG: "${{ env.CHANGELOG }}"
          APK_VERSIONED_PATH: "app/build/outputs/apk/release/Quarry-v${{ env.VERSION_NAME }}.apk"
          APK_LATEST_PATH: "app/build/outputs/apk/release/Quarry.apk"
        run: python3 .github/scripts/bot.py release
