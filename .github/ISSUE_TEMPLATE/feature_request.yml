name: Feature Request
description: Suggest an idea, enhancement, or new feature for Quarry
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for Quarry. Please provide as much detail as possible about the feature and why it would be useful.

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or a specific storage workflow?
      placeholder: I always struggle when...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen and how it should work.
      placeholder: Add an option to...
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
      placeholder: Describe alternatives...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, UI concept sketches, or screenshots.
    validations:
      required: false
