name: Bug Report
description: Report a bug, crash, or unexpected behavior in Quarry
title: "[Bug]: "
labels: ["bug"]
assignees:
  - tanvirr007
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Anyone is welcome to report a bug. Even if you are not sure about all technical details, please fill out what you can. Every report helps us investigate and improve Quarry.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong or what happened.
      placeholder: Tell us what happened in your own words...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: What were you doing when the issue occurred? (Step-by-step instructions help us fix it faster).
      placeholder: |
        1. Open Quarry
        2. Go to '...'
        3. Tap on '...'
        4. Notice the error / crash
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened instead?
      placeholder: |
        - Expected: The scan should finish and display the storage graph.
        - Actual: The screen turned black and the app closed.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Quarry Version
      description: App version from Quarry (found in Settings > About) or release version.
      placeholder: e.g. v1.0.0 (or "Latest release" if unsure)
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device Model & Manufacturer
      description: What phone or tablet are you using?
      placeholder: e.g. Samsung Galaxy S23, Google Pixel 8, Xiaomi 13
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version / ROM
      description: Android OS version and custom ROM / skin (if known).
      placeholder: e.g. Android 14 (One UI 6.1) / Android 13 / LineageOS 21
    validations:
      required: false

  - type: checkboxes
    id: permissions
    attributes:
      label: Storage Permissions Status
      description: Which storage permissions were granted to Quarry?
      options:
        - label: All Files Access (MANAGE_EXTERNAL_STORAGE)
        - label: Standard Media / Storage access
        - label: Not sure / default permissions

  - type: textarea
    id: log_file_and_stacktrace
    attributes:
      label: Attach Log File / Logcat / Crash Stack Trace
      description: |
        Attach your log file (.log, .txt, .zip) or paste logcat / crash logs here.
        - Tip: Tap "Add Files" below or drag and drop your file directly into this box.
        - If using ADB: `adb logcat -d > quarry.log` and attach the file.
      placeholder: Attach your .log / .txt / .zip file here, or paste error logs / stack traces...
    validations:
      required: false

  - type: textarea
    id: screenshots_and_media
    attributes:
      label: Screenshots or Screen Recordings
      description: Drag and drop screenshots or screen recordings here. Visual examples are super helpful for UI or display issues!
      placeholder: Drag and drop images (.png, .jpg) or videos (.mp4, .gif) here...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other information, thoughts, or questions you would like to share.
      placeholder: Any extra details that might help us understand the problem...
    validations:
      required: false
